<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gemini 對話台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* 版面：左側對話清單 + 置中閱讀欄 + 底部輸入框；色調為帶綠的中性灰配深青綠 */
:root{
  --bg:#f6f7f4; --panel:#eceee9; --surface:#ffffff; --ink:#1c2321; --muted:#66706c;
  --line:#d9ddd6; --accent:#0e6b5c; --accent-ink:#ffffff; --bubble:#e3e8e1;
  --danger:#b3392f; --code-bg:#eff1ec;
  --s1:#8a3b12; --s2:#0e6b5c; --s3:#5a4a9c; --s4:#7b8580;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151a19; --panel:#0f1312; --surface:#1e2524; --ink:#e6ebe8; --muted:#93a09b;
    --line:#2c3533; --accent:#4fc3ad; --accent-ink:#06211c; --bubble:#27302e;
    --danger:#ef8a80; --code-bg:#0f1312;
    --s1:#f0a36b; --s2:#6fd3bf; --s3:#b3a6f2; --s4:#7d8a85;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a19; --panel:#0f1312; --surface:#1e2524; --ink:#e6ebe8; --muted:#93a09b;
  --line:#2c3533; --accent:#4fc3ad; --accent-ink:#06211c; --bubble:#27302e;
  --danger:#ef8a80; --code-bg:#0f1312;
  --s1:#f0a36b; --s2:#6fd3bf; --s3:#b3a6f2; --s4:#7d8a85;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{display:flex;height:var(--vh,100dvh);width:100%}

/* 側欄 */
aside{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  transition:margin-left .22s ease,transform .22s ease}
.brand{font-weight:700;letter-spacing:.02em;padding:4px 6px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
#search{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:4px;border-radius:9px;min-height:42px;padding:0 6px 0 10px}
.item.on{background:var(--bubble)}
.item .t{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:42px}
.item input{flex:1;min-width:0;border:1px solid var(--accent);border-radius:6px;background:var(--surface);padding:4px 6px}
.item .mini{font-size:13px;color:var(--muted);padding:6px;border-radius:6px;white-space:nowrap}
.item .mini.warn{color:var(--danger);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:10px}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
@media (min-width:900px){ #app.collapsed aside{margin-left:-280px} }
@media (max-width:899px){
  aside{position:fixed;top:0;bottom:0;left:0;z-index:20;transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.25)}
  #app.drawer aside{transform:none}
  #app.drawer #scrim{display:block}
}

/* 主區 */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;min-height:52px}
.icon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon:active,.item .t:active{opacity:.6}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px;color:var(--muted)}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#msgs{max-width:780px;margin:0 auto;padding:12px 20px 28px;display:flex;flex-direction:column;gap:22px}

.msg.user{align-self:flex-end;max-width:86%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bubble{background:var(--bubble);border-radius:18px 18px 4px 18px;padding:10px 15px;overflow-wrap:anywhere}
.utext{white-space:pre-wrap}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.atts img{max-width:180px;max-height:180px;border-radius:10px;display:block}
.filechip{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.acts button{padding:6px 9px;border-radius:7px;min-height:34px}
.acts button:active{background:var(--bubble)}
.acts .meta{margin-left:6px;font-variant-numeric:tabular-nums}

.msg.model{min-width:0}
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.7em 0}
.md h1,.md h2,.md h3,.md h4{line-height:1.35;margin:1.3em 0 .5em;text-wrap:balance}
.md h1{font-size:1.4em}.md h2{font-size:1.22em}.md h3{font-size:1.08em}.md h4{font-size:1em}
.md ul,.md ol{padding-left:1.5em;margin:.6em 0}
.md li{margin:.25em 0}
.md a{color:var(--accent);text-underline-offset:3px}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);border-radius:5px;padding:.12em .35em}
.md img{max-width:100%}
.tablewrap{overflow-x:auto;margin:.8em 0}
.md table{border-collapse:collapse;font-size:.94em}
.md th,.md td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
.md th{background:var(--code-bg)}
.code{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:.9em 0;background:var(--code-bg)}
.code .bar{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 2px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.code .bar button{padding:6px 9px;border-radius:6px;min-height:32px}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.code pre code{background:none;padding:0;font-size:13.5px;line-height:1.55;white-space:pre}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type,.hljs-built_in{color:var(--s3)}
.hljs-string,.hljs-regexp,.hljs-attr,.hljs-symbol,.hljs-addition{color:var(--s2)}
.hljs-number,.hljs-title,.hljs-section,.hljs-name,.hljs-meta,.hljs-deletion{color:var(--s1)}
.hljs-comment,.hljs-quote{color:var(--s4);font-style:italic}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:.25em 0;margin:.8em 0}
.thoughts{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;color:var(--muted);font-size:14px}
.thoughts summary{padding:8px 14px;cursor:pointer;list-style:none}
.thoughts summary::-webkit-details-marker{display:none}
.thoughts summary::before{content:"▸ "}
.thoughts[open] summary::before{content:"▾ "}
.thoughts .md{padding:0 14px 12px}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sources a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{margin-top:10px;border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:10px 14px;font-size:14.5px;overflow-wrap:anywhere}
.note{margin-top:8px;font-size:13.5px;color:var(--muted)}
.foot{margin-top:6px}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 歡迎畫面 */
.welcome{margin:auto;max-width:620px;padding:8vh 0 0;display:flex;flex-direction:column;gap:18px}
.welcome h1{font-size:30px;line-height:1.3;margin:0;font-weight:650;text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.chips button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;line-height:1.45}
.chips button small{display:block;color:var(--muted)}

/* 輸入區 */
#toBottom{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.15);display:grid;place-items:center;z-index:5}
footer{padding:0 16px calc(8px + env(safe-area-inset-bottom))}
.fwrap{max-width:780px;margin:0 auto}
#banner{font-size:13.5px;color:var(--muted);padding:4px 8px;display:flex;gap:10px;align-items:center}
#banner button{color:var(--accent);padding:4px}
#composer{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 10px 8px 14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
#composer:focus-within{border-color:var(--accent)}
#attRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#attRow .filechip{display:inline-flex;align-items:center;gap:6px;padding-right:4px}
#attRow .filechip button{width:24px;height:24px;border-radius:50%;color:var(--muted)}
#input{display:block;width:100%;border:0;outline:0;background:none;resize:none;max-height:38vh;padding:4px 0;line-height:1.55}
.cbar{display:flex;align-items:center;gap:6px;margin-top:4px}
.cbar .icon{width:38px;height:38px;border:1px solid var(--line)}
.pill{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#model{min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px;max-width:44vw;min-width:0}
.grow{flex:1}
#send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#send:disabled{opacity:.35}
#send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#send.stop svg{fill:currentColor;stroke:none}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}

/* 設定 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:min(88%,calc(var(--vh,100dvh) - 32px));display:flex;flex-direction:column}
.sheet h2{margin:0;font-size:18px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 8px 20px}
.sheet .body{overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lab{font-weight:600;font-size:14.5px}
.f small{color:var(--muted);line-height:1.5}
.f input[type=text],.f input[type=password],.f textarea,.f select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;min-height:42px}
.f textarea{min-height:96px;resize:vertical}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.sheet a{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="對話清單">
    <div class="brand"><i></i>Gemini 對話台</div>
    <button class="btn primary" id="newChat">＋ 新對話</button>
    <input id="search" type="search" placeholder="搜尋對話" autocomplete="off">
    <nav id="chatList"></nav>
    <button class="btn" id="openSettings">設定</button>
  </aside>
  <div id="scrim"></div>
  <main>
    <header>
      <button class="icon" id="sideToggle" aria-label="開關對話清單"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div id="title"></div>
      <button class="icon" id="newChat2" aria-label="新對話"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </header>
    <div id="scroll"><div id="msgs"></div></div>
    <button id="toBottom" hidden aria-label="捲到最新"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <footer><div class="fwrap">
      <div id="banner" hidden><span>正在編輯先前的訊息，送出後會從該處重新開始。</span><button id="cancelEdit">取消</button></div>
      <div id="composer">
        <div id="attRow" hidden></div>
        <textarea id="input" rows="1" placeholder="輸入訊息，或貼上圖片"></textarea>
        <div class="cbar">
          <button class="icon" id="attach" aria-label="加入檔案"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <input type="file" id="file" multiple hidden>
          <button class="pill" id="searchToggle" aria-pressed="false">Google 搜尋</button>
          <span class="grow"></span>
          <select id="model" aria-label="模型"></select>
          <button id="send" aria-label="送出"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <p class="hint">回覆由 Gemini 產生，可能有誤，重要內容請再查證。</p>
    </div></footer>
  </main>
</div>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <div class="top"><h2>設定</h2><button class="icon" id="closeSettings" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="body">
      <div class="f"><label for="key1">Gemini API 金鑰</label>
        <div class="row"><input id="key1" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上 AI Studio 的金鑰" style="flex:1"><button class="btn" id="showKey">顯示</button></div>
        <small>金鑰只存在這台裝置的瀏覽器，直接送往 Google。<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">到 AI Studio 取得金鑰</a></small></div>
      <div class="f"><label for="key2">備用金鑰（選填）</label>
        <input id="key2" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <small>主要金鑰達到用量上限時自動改用。</small></div>
      <div class="f"><span class="lab">模型清單</span>
        <div class="row"><button class="btn" id="refreshModels">從 Google 重新載入</button><small id="modelCount"></small></div>
        <input id="customModel" type="text" autocapitalize="off" spellcheck="false" placeholder="自訂模型 ID，例如 gemini-3.5-flash"></div>
      <div class="f"><label for="system">系統指示</label>
        <textarea id="system" placeholder="例如：一律使用繁體中文回答；數學式用 LaTeX。"></textarea>
        <small>每次對話都會附上。</small></div>
      <div class="f"><span class="lab">溫度</span>
        <div class="row"><input type="checkbox" id="useTemp"><label for="useTemp" style="font-weight:400">自訂</label><input type="range" id="temp" min="0" max="2" step="0.1"><span id="tempVal" style="width:2.2em;text-align:right;font-variant-numeric:tabular-nums"></span></div>
        <small>未勾選時使用模型預設值。</small></div>
      <div class="f"><div class="row"><input type="checkbox" id="thoughts"><label for="thoughts">顯示思考摘要</label></div>
        <small>部分模型不支援，出現錯誤時請關閉。</small></div>
      <div class="f"><div class="row"><input type="checkbox" id="enterSend"><label for="enterSend">按 Enter 送出（Shift + Enter 換行）</label></div></div>
      <div class="f"><label for="theme">外觀</label>
        <select id="theme"><option value="auto">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select></div>
      <div class="f"><span class="lab">資料</span>
        <div class="row"><button class="btn" id="exportBtn">匯出對話</button><button class="btn" id="importBtn">匯入對話</button><input type="file" id="importFile" accept=".json,application/json" hidden><button class="btn danger" id="clearAll">清除所有對話</button></div>
        <small>對話存在這個瀏覽器裡。Safari 可能清除久未開啟網站的資料，重要對話請定期匯出。</small></div>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const API = 'https://generativelanguage.googleapis.com/v1beta';
const FALLBACK_MODELS = [
  {id:'gemini-3.6-flash', name:'Gemini 3.6 Flash'},
  {id:'gemini-3.5-flash', name:'Gemini 3.5 Flash'},
  {id:'gemini-3.5-flash-lite', name:'Gemini 3.5 Flash-Lite'},
  {id:'gemini-3.1-flash-lite', name:'Gemini 3.1 Flash-Lite'},
  {id:'gemini-3.1-pro-preview', name:'Gemini 3.1 Pro'}
];

/* ---------- 儲存 ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const S = Object.assign({ key1:'', key2:'', model:'gemini-3.5-flash', customModel:'', system:'', useTemp:false, temp:1,
  search:false, thoughts:false, enterSend:true, theme:'auto', models:FALLBACK_MODELS, modelsAt:0, sideOpen:true, last:'' }, LS.get('gh.settings', {}));
const saveS = () => LS.set('gh.settings', S);

const DB = {
  db: null,
  open() { return new Promise(res => { try {
    const r = indexedDB.open('gemini-harness', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('chats', { keyPath: 'id' });
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => res();
  } catch { res(); } }); },
  tx(mode, fn) { return new Promise(res => { if (!this.db) return res(null); try {
    const rq = fn(this.db.transaction('chats', mode).objectStore('chats'));
    rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
  } catch { res(null); } }); },
  all() { return this.tx('readonly', s => s.getAll()).then(r => r || []); },
  put(c) { return this.tx('readwrite', s => s.put(c)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  clear() { return this.tx('readwrite', s => s.clear()); }
};

/* ---------- Markdown / 數學式 ---------- */
if (window.DOMPurify) DOMPurify.addHook('afterSanitizeAttributes', n => { if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); } });

function renderMD(src) {
  if (!window.marked || !window.DOMPurify) return '<p style="white-space:pre-wrap">' + esc(src) + '</p>';
  const math = [];
  const stash = (tex, display) => { math.push({ tex, display }); return 'ZZMATH' + (math.length - 1) + 'ZZ'; };
  const parts = src.split(/(```[\s\S]*?(?:```|$)|`[^`\n]+`)/g);   // 奇數索引是程式碼，不動
  for (let i = 0; i < parts.length; i += 2) {
    parts[i] = parts[i]
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => stash(t, true))
      .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => stash(t, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => stash(t, false))
      .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$(?!\d)/g, (_, t) => stash(t, false));
  }
  let html = DOMPurify.sanitize(marked.parse(parts.join(''), { breaks: true, gfm: true }));
  return html.replace(/ZZMATH(\d+)ZZ/g, (_, n) => {
    const { tex, display } = math[n];
    if (!window.katex) return esc(display ? '$$' + tex + '$$' : '$' + tex + '$');
    try { return katex.renderToString(tex, { displayMode: display, throwOnError: false, output: 'html' }); } catch { return esc(tex); }
  });
}

function decorate(root, final) {
  root.querySelectorAll('table').forEach(t => { const w = h('div', 'tablewrap'); t.replaceWith(w); w.append(t); });
  root.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code'); if (!code) return;
    const lang = (code.className.match(/language-([\w+#-]+)/) || [])[1] || '';
    if (window.hljs) { try {
      if (lang && hljs.getLanguage(lang)) code.innerHTML = hljs.highlight(code.textContent, { language: lang }).value;
      else if (final && code.textContent.length < 20000) code.innerHTML = hljs.highlightAuto(code.textContent).value;
    } catch {} }
    const box = h('div', 'code'), bar = h('div', 'bar');
    bar.append(h('span', '', lang || '程式碼'));
    const b = h('button', '', '複製'); b.dataset.act = 'copycode'; bar.append(b);
    pre.replaceWith(box); box.append(bar, pre);
  });
}

/* ---------- 附件 ---------- */
const TEXT_EXT = /\.(md|txt|csv|tsv|json|js|mjs|ts|tsx|jsx|py|c|cc|cpp|h|hpp|java|html|css|xml|yml|yaml|tex|m|sh|rs|go|swift|kt|sql|log|ini|toml|r|rb|php)$/i;
const readAs = (f, how) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r[how](f); });
async function shrinkImage(f) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
  } finally { URL.revokeObjectURL(url); }
}
async function addFiles(files) {
  for (const f of files) {
    try {
      if (f.type.startsWith('text/') || f.type === 'application/json' || TEXT_EXT.test(f.name)) {
        if (f.size > 1.5e6) { toast(f.name + ' 太大，文字檔上限約 1.5 MB'); continue; }
        pending.push({ kind: 'text', name: f.name, mime: 'text/plain', text: await readAs(f, 'readAsText') });
      } else {
        if (f.size > 15e6) { toast(f.name + ' 太大，上限 15 MB'); continue; }
        let mime = f.type || 'application/octet-stream', data;
        if (/^image\/(jpeg|png|webp)$/.test(mime) && f.size > 1.2e6) { try { ({ mime, data } = await shrinkImage(f)); } catch {} }
        if (!data) data = (await readAs(f, 'readAsDataURL')).split(',')[1];
        pending.push({ kind: 'inline', name: f.name || '貼上的圖片', mime, data });
      }
    } catch { toast('讀取 ' + f.name + ' 失敗'); }
  }
  renderAtts(); updateSend();
}

/* ---------- Gemini API ---------- */
function toContents(msgs) {
  const out = [];
  for (const m of msgs) {
    const parts = [];
    if (m.role === 'user') {
      for (const a of m.atts || []) parts.push(a.kind === 'text' ? { text: '【附件：' + a.name + '】\n' + a.text } : { inlineData: { mimeType: a.mime, data: a.data } });
      if (m.text) parts.push({ text: m.text });
    } else if (m.text) parts.push({ text: m.text });
    if (!parts.length) continue;
    const last = out[out.length - 1];
    if (last && last.role === m.role) last.parts.push(...parts); else out.push({ role: m.role, parts });
  }
  return out;
}
function explain(e) {
  const s = e.status, raw = e.message || '';
  let t = s === 429 ? '已達用量上限，請稍後再試或換一個模型。'
    : s === 404 ? '找不到這個模型，請到設定重新載入模型清單。'
    : s === 403 || /API key/i.test(raw) ? 'API 金鑰無效或沒有權限，請到設定檢查金鑰。'
    : s === 503 || s === 500 ? '模型目前忙碌，請稍後重試。'
    : s === 400 ? '請求被拒絕。若開啟了「Google 搜尋」或「顯示思考摘要」，這個模型可能不支援，請關閉後重試。'
    : !s ? '連線失敗，請檢查網路。' : '發生錯誤。';
  return t + (raw ? '（' + (s ? s + '：' : '') + raw.slice(0, 300) + '）' : '');
}
async function stream(key, model, body, signal, onChunk) {
  const res = await fetch(API + '/models/' + model + ':streamGenerateContent?alt=sse', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body), signal });
  if (!res.ok) { let msg = ''; try { msg = (await res.json()).error.message; } catch {} const e = new Error(msg); e.status = res.status; throw e; }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      let j; try { j = JSON.parse(line.slice(5)); } catch { continue; }
      onChunk(j);
    }
  }
}

async function run(chat, msg) {
  const keys = [S.key1, S.key2].filter(Boolean);
  const idx = chat.messages.indexOf(msg);
  const body = { contents: toContents(chat.messages.slice(0, idx)) };
  if (S.system.trim()) body.systemInstruction = { parts: [{ text: S.system.trim() }] };
  const gc = {};
  if (S.useTemp) gc.temperature = S.temp;
  if (S.thoughts) gc.thinkingConfig = { includeThoughts: true };
  if (Object.keys(gc).length) body.generationConfig = gc;
  if (S.search) body.tools = [{ googleSearch: {} }];

  const ctrl = new AbortController();
  busy = { ctrl, msg }; msg.streaming = true; msg.model = S.model; updateSend();
  let raf = 0;
  const paint = () => { if (!raf) raf = setTimeout(() => { raf = 0; refreshMsg(msg); }, 70); };
  const onChunk = j => {
    if (j.error) { const e = new Error(j.error.message || ''); e.status = j.error.code; throw e; }
    if (j.promptFeedback && j.promptFeedback.blockReason) msg.note = '提示內容被安全機制擋下（' + j.promptFeedback.blockReason + '）。';
    const c = (j.candidates || [])[0];
    if (c) {
      for (const p of (c.content && c.content.parts) || []) { if (typeof p.text !== 'string') continue; if (p.thought) msg.thoughts = (msg.thoughts || '') + p.text; else msg.text += p.text; }
      const g = c.groundingMetadata;
      if (g && g.groundingChunks) { const seen = new Set(), src = []; for (const k of g.groundingChunks) { const w = k.web; if (w && w.uri && !seen.has(w.uri)) { seen.add(w.uri); src.push({ uri: w.uri, title: w.title || '' }); } } if (src.length) msg.sources = src; }
      if (c.finishReason && c.finishReason !== 'STOP') msg.note = c.finishReason === 'MAX_TOKENS' ? '回覆達到長度上限而中斷。' : '回覆提前結束（' + c.finishReason + '）。';
    }
    if (j.usageMetadata) msg.usage = j.usageMetadata;
    paint();
  };
  try {
    if (!keys.length) throw Object.assign(new Error('尚未設定金鑰'), { status: 403 });
    for (let k = 0; k < keys.length; k++) {
      try { await stream(keys[k], S.model, body, ctrl.signal, onChunk); break; }
      catch (e) { if (e.name !== 'AbortError' && (e.status === 429 || e.status === 403) && k < keys.length - 1 && !msg.text) continue; throw e; }
    }
    if (!msg.text && !msg.note) msg.note = '模型沒有回傳內容。';
  } catch (e) {
    if (e.name === 'AbortError') msg.note = '已停止。'; else msg.error = explain(e);
  }
  clearTimeout(raf); delete msg.streaming; busy = null; updateSend();
  refreshMsg(msg); await persist(chat); renderList();
  if (chat.auto && msg.text) autoTitle(chat);
}

async function autoTitle(chat) {
  delete chat.auto;
  const key = S.key1 || S.key2, first = chat.messages.find(m => m.role === 'user');
  if (!key || !first || !first.text) return;
  try {
    const r = await fetch(API + '/models/' + S.model + ':generateContent', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: '請為以下對話開頭取一個不超過 12 個字的繁體中文標題。只輸出標題本身，不要引號、標點或說明。\n\n' + first.text.slice(0, 600) }] }] }) });
    if (!r.ok) return;
    const j = await r.json();
    const t = ((j.candidates[0].content.parts || []).filter(p => !p.thought).map(p => p.text || '').join('')).trim().split('\n')[0].replace(/^["「『《]+|["」』》。]+$/g, '').slice(0, 30);
    if (t) { chat.title = t; await persist(chat); renderList(); if (cur === chat) { $('#title').textContent = t; document.title = t + ' · Gemini 對話台'; } }
  } catch {}
}

/* ---------- 動作 ---------- */
function newChat() { if (busy) busy.ctrl.abort(); cur = null; editing = null; $('#banner').hidden = true; S.last = ''; saveS(); renderChat(); renderList(); closeDrawer(); if (!narrow()) $('#input').focus(); }
function openChat(id) { const c = chats.find(x => x.id === id); if (!c) return; cur = c; editing = null; $('#banner').hidden = true; S.last = id; saveS(); renderChat(); renderList(); closeDrawer(); }

async function submit() {
  if (busy) { busy.ctrl.abort(); return; }
  const inp = $('#input'), text = inp.value.trim();
  if (!text && !pending.length) return;
  if (!S.key1 && !S.key2) { openSettings(); toast('請先填入 API 金鑰'); return; }
  if (!cur) { cur = { id: uid(), title: (text || pending[0].name).slice(0, 24), created: Date.now(), updated: Date.now(), messages: [], auto: true }; chats.push(cur); S.last = cur.id; saveS(); }
  if (editing) { const i = cur.messages.findIndex(m => m.id === editing); if (i >= 0) cur.messages.length = i; editing = null; $('#banner').hidden = true; }
  const u = { id: uid(), role: 'user', text, atts: pending };
  const m = { id: uid(), role: 'model', text: '' };
  cur.messages.push(u, m);
  pending = []; inp.value = ''; grow(); renderAtts();
  renderChat(); renderList();
  await run(cur, m);
}
async function regen() {
  if (busy || !cur) return;
  const last = cur.messages[cur.messages.length - 1]; if (!last || last.role !== 'model') return;
  const m = { id: uid(), role: 'model', text: '' };
  cur.messages[cur.messages.length - 1] = m;
  renderChat(); await run(cur, m);
}

$('#msgs').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'copycode') return copyText(b.closest('.code').querySelector('code').textContent);
  const el = b.closest('.msg'), m = cur && cur.messages.find(x => x.id === el.dataset.id); if (!m) return;
  if (act === 'copy') copyText(m.text);
  else if (act === 'regen') regen();
  else if (act === 'edit') {
    if (busy) return toast('請先停止目前的回覆');
    editing = m.id; pending = (m.atts || []).slice(); $('#input').value = m.text; $('#banner').hidden = false;
    renderAtts(); grow(); updateSend(); $('#input').focus();
  }
});
$('#cancelEdit').onclick = () => { editing = null; pending = []; $('#input').value = ''; $('#banner').hidden = true; renderAtts(); grow(); updateSend(); };

$('#chatList').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const it = b.closest('.item'), id = it.dataset.id, c = chats.find(x => x.id === id);
  if (b.dataset.act === 'open') openChat(id);
  else if (b.dataset.act === 'rename') {
    const inp = h('input'); inp.value = c.title; inp.setAttribute('aria-label', '對話名稱');
    it.innerHTML = ''; it.append(inp); inp.focus(); inp.select();
    const done = async ok => { if (done.x) return; done.x = 1; const v = inp.value.trim(); if (ok && v) { c.title = v; delete c.auto; await persist(c); } renderList(); if (cur === c) $('#title').textContent = c.title; };
    inp.onkeydown = ev => { if (ev.key === 'Enter' && !ev.isComposing) done(true); else if (ev.key === 'Escape') done(false); };
    inp.onblur = () => done(true);
  } else if (b.dataset.act === 'delete') {
    if (!b.classList.contains('warn')) { b.classList.add('warn'); b.textContent = '確定刪除'; setTimeout(() => { if (b.isConnected) { b.classList.remove('warn'); b.textContent = '刪除'; } }, 3000); return; }
    if (busy && cur === c) busy.ctrl.abort();
    chats = chats.filter(x => x !== c); await DB.del(id);
    if (cur === c) { cur = null; S.last = ''; saveS(); renderChat(); }
    renderList();
  }
});

$('#newChat').onclick = newChat; $('#newChat2').onclick = newChat;
$('#search').oninput = renderList;
$('#sideToggle').onclick = () => { if (narrow()) $('#app').classList.toggle('drawer'); else { S.sideOpen = !S.sideOpen; saveS(); applySide(); } };
$('#scrim').onclick = closeDrawer;
$('#send').onclick = submit;
$('#toBottom').onclick = () => { stick = true; toBottom(); };
$('#scroll').addEventListener('scroll', () => { const s = $('#scroll'); stick = s.scrollHeight - s.scrollTop - s.clientHeight < 60; $('#toBottom').hidden = stick; }, { passive: true });
$('#input').addEventListener('input', () => { grow(); updateSend(); });
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && S.enterSend) { e.preventDefault(); submit(); } });
$('#input').addEventListener('paste', e => { const f = [...(e.clipboardData && e.clipboardData.files || [])]; if (f.length) { e.preventDefault(); addFiles(f); } });
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('#searchToggle').onclick = () => { S.search = !S.search; saveS(); $('#searchToggle').setAttribute('aria-pressed', S.search); };
$('#model').onchange = e => { S.model = e.target.value; saveS(); };

/* ---------- 設定 ---------- */
async function loadModels(quiet) {
  const key = S.key1 || S.key2; if (!key) { if (!quiet) toast('請先填入 API 金鑰'); return; }
  try {
    const r = await fetch(API + '/models?pageSize=1000', { headers: { 'x-goog-api-key': key } });
    if (!r.ok) { let msg = ''; try { msg = (await r.json()).error.message; } catch {} throw Object.assign(new Error(msg), { status: r.status }); }
    const list = ((await r.json()).models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => ({ id: m.name.replace(/^models\//, ''), name: m.displayName || m.name }))
      .filter(m => /^gemini/.test(m.id) && !/(embedding|image|tts|live|audio|aqa|robotics|computer-use|transcribe|translate)/.test(m.id));
    if (list.length) { S.models = list; S.modelsAt = Date.now(); if (!list.some(m => m.id === S.model) && S.model !== S.customModel) S.model = list[0].id; saveS(); modelOptions(); if (!quiet) toast('已載入 ' + list.length + ' 個模型'); }
  } catch (e) { if (!quiet) toast(explain(e).slice(0, 60)); }
}
function openSettings() {
  $('#key1').value = S.key1; $('#key2').value = S.key2; $('#customModel').value = S.customModel; $('#system').value = S.system;
  $('#useTemp').checked = S.useTemp; $('#temp').value = S.temp; $('#temp').disabled = !S.useTemp; $('#tempVal').textContent = Number(S.temp).toFixed(1);
  $('#thoughts').checked = S.thoughts; $('#enterSend').checked = S.enterSend; $('#theme').value = S.theme;
  $('#modal').hidden = false; closeDrawer();
}
function closeSettings() { $('#modal').hidden = true; if (cur === null || !cur.messages.length) renderChat(); }
$('#openSettings').onclick = openSettings; $('#closeSettings').onclick = closeSettings;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSettings(); });
$('#key1').onchange = e => { S.key1 = e.target.value.trim(); saveS(); loadModels(true); };
$('#key2').onchange = e => { S.key2 = e.target.value.trim(); saveS(); };
$('#showKey').onclick = () => { const k = $('#key1'), on = k.type === 'password'; k.type = $('#key2').type = on ? 'text' : 'password'; $('#showKey').textContent = on ? '隱藏' : '顯示'; };
$('#refreshModels').onclick = () => loadModels(false);
$('#customModel').onchange = e => { S.customModel = e.target.value.trim(); if (S.customModel) S.model = S.customModel; saveS(); modelOptions(); };
$('#system').onchange = e => { S.system = e.target.value; saveS(); };
$('#useTemp').onchange = e => { S.useTemp = e.target.checked; $('#temp').disabled = !S.useTemp; saveS(); };
$('#temp').oninput = e => { S.temp = Number(e.target.value); $('#tempVal').textContent = S.temp.toFixed(1); saveS(); };
$('#thoughts').onchange = e => { S.thoughts = e.target.checked; saveS(); };
$('#enterSend').onchange = e => { S.enterSend = e.target.checked; saveS(); };
$('#theme').onchange = e => { S.theme = e.target.value; saveS(); applyTheme(); };
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'gemini-harness', version: 1, exported: new Date().toISOString(), chats }, null, 1)], { type: 'application/json' });
  const a = h('a'); a.href = URL.createObjectURL(blob); a.download = 'gemini-chats-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await readAs(f, 'readAsText')); let n = 0;
    for (const c of j.chats || []) { if (!c || !c.id || !Array.isArray(c.messages)) continue; const i = chats.findIndex(x => x.id === c.id); if (i >= 0) chats[i] = c; else chats.push(c); await DB.put(c); n++; }
    if (cur) cur = chats.find(x => x.id === cur.id) || null;
    renderList(); renderChat(); toast('已匯入 ' + n + ' 則對話');
  } catch { toast('這不是有效的匯出檔'); }
};
$('#clearAll').onclick = async e => {
  const b = e.currentTarget;
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '再按一次確定清除'; setTimeout(() => { b.dataset.sure = ''; b.textContent = '清除所有對話'; }, 3000); return; }
  if (busy) busy.ctrl.abort();
  chats = []; cur = null; S.last = ''; saveS(); await DB.clear(); renderList(); renderChat(); b.dataset.sure = ''; b.textContent = '清除所有對話'; toast('已清除');
};

/* ---------- 螢幕鍵盤：讓版面跟著可視區域縮放 ---------- */
const vv = window.visualViewport;
function fit() { document.documentElement.style.setProperty('--vh', (vv ? vv.height : window.innerHeight) + 'px'); if (vv) window.scrollTo(0, 0); if (stick) toBottom(); }
if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
window.addEventListener('resize', fit);

/* ---------- 啟動 ---------- */
(async () => {
  applyTheme(); applySide(); fit(); modelOptions();
  $('#searchToggle').setAttribute('aria-pressed', S.search);
  await DB.open();
  chats = await DB.all();
  cur = chats.find(c => c.id === S.last) || null;
  renderList(); renderChat(); updateSend();
  if ((S.key1 || S.key2) && Date.now() - S.modelsAt > 864e5) loadModels(true);
})();
})();
</script>
</body>
</html>
